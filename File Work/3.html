<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q3 - CSS Styling</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
        }
        .box {
            background-color: lightcoral;
            color: white;
            padding: 20px;
            margin: 15px;
            height: 100px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1 style="color: darkblue; text-align: center;">Demonstrating CSS Types</h1>

    <div class="box">
        This box uses Internal CSS (margins, padding, width, height, colors, and background).
    </div>

    <p style="font-size: 18px; font-weight: bold; margin-left: 15px;">
        This paragraph uses Inline CSS properties for text styling.
    </p>
</body>
</html>
