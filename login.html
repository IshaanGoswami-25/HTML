<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <center><h1>Student Login Page</h1></center>
</head>
<style>
    .login-form{
        width: 50%;
        height: 250px;
        background-color: white ;
        border-radius: 10px;
        padding: 10px;
    }
    .login-form input{
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    .login-form button{
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        background-color: blue;
        color: white;
    }
</style>
<body bgcolor="white" text="black">
<center>
    <form>
        <fieldset class="login-form">
        FirstName: <input type = "text"><br><br>
        LastName: <input type = "text"><br><br>
        Department: <input type = "text"><br><br>
        RollNo: <input type = "text"><br><br>
        Date Of Birth: <input type = "date"><br><br>
        <label for = "Gender">Gender:</label><br>
        Male: <input type = "radio" name = "Gender">
        Female: <input type = "radio" name="Gender"><br><br>
        <button>Login</button>
        </fieldset>
    </form>
</center>
</body>
</html>
